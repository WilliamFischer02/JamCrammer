# JamCrammer configuration (copy to config.yaml; config.yaml is gitignored).
# Every number lives here or in profiles/*.yaml. Code has no magic numbers.

# --- Window and capture ---
window_title_match: "Animal Jam Classic"     # exact top-level window title
window_process_name: "AJ Classic.exe"        # Electron client; browser tabs with the same title are ignored
capture_backend: auto                        # auto | wgc | mss
fps: 4                                       # steady-state capture rate

# --- Timing (seconds) ---
hunt_interval_s: 300
opportunist_check_s: 300
resume_after_idle_s: 120
heartbeat_s: 180

# --- Anti-AFK ---
antiafk:
  tap_ms: 200
  gap_ms: 300
  settle_ms: 400                             # wait after a pair before the drift check
  pattern: [[left, right], [up, down], [right, left], [down, up]]

# --- Behavior toggles ---
auto_join: true
start_farming_after_join: true
unknown_fact_policy: learned_prior           # learned_prior | fixed_true | fixed_false | skip
answer_mode: learn_only                      # learn_only | bank_policy | coin_flip
fuzzy_threshold: 90

# --- Notifications ---
notify:
  toast: true
  sound: true
  ntfy_topic: ""                             # empty = disabled
  ntfy_server: "https://ntfy.sh"
  discord_webhook: ""                        # empty = disabled
  levels:
    toast: NOTICE                            # minimum level that raises a toast
    sound: HIGH
    push: HIGH                               # ntfy + discord
  sound_repeats: 3                           # HIGH alerts repeat the sound
  sound_interval_s: 1.5
  timeout_s: 10

# --- Popup Watchdog ---
watchdog:
  fps: 2                                     # minimum detection rate
  clear_timeout_s: 3                         # popup must be gone this long after the click
  ocr_interval_s: 5                          # keyword-only OCR cadence when no green button is seen
  max_retries: 1
  unknown_cooldown_s: 60                     # don't re-alert the same unknown dialog more often
  unknown_min_ticks: 3                       # an unknown modal must persist this many ticks before alerting
  baseline_refresh_s: 30                     # re-take the room baseline this often while nothing is detected

# --- Room-drift guard ---
drift:
  threshold: 18                              # mean abs diff (0-255) on the masked downscale
  downscale: [64, 36]

# --- Double Up farmer (KICKOFF 9.2) ---
double_up:
  preview_s: 3                               # the board is shown for 3 s
  burst_fps: 10                              # burst capture during the preview
  pair_confidence_min: 0.6                   # below this: reveal-and-remember
  flip_ms: 400                               # flip animation (profile may override later)
  settle_s: 0.15
  click_gap_s: 0.08
  poll_s: 0.25
  board_timeout_s: 20
  hide_timeout_s: 5
  end_timeout_s: 10
  change_threshold: 18                       # tile face mean abs diff that counts as a flip
  same_face_distance: 0.35                   # descriptor distance treated as the same face
  preview_diversity: 0.5                     # mean tile distance when all faces are up
  hidden_uniformity: 0.25                    # mean tile distance when all tiles are hidden
  tile_min_std: 8
  end_screen_keywords: [earned, gems, play again]

# --- Best Guess farmer (Phase C, KICKOFF 8.3) ---
bestguess:
  fps: 5
  commit_after_s: 3                          # commit 2-4 s after the question appears
  lock_seconds: 5                            # countdown value at/below which sides can't change
  verify_after_s: 1
  heartbeat_s: 180                           # re-click the current side after this long idle
  unknown_pause_s: 30                        # UNKNOWN screen for this long -> pause + alert
  fact_min_chars: 8
  question_s: 10                             # question length; used when the countdown can't be read
  waiting_keywords: [get ready, next round, waiting, starting]
  ocr_upscale: 2.0
  reveal_min_fill: 0.15                      # fraction of the reveal ROI that must be green/purple
  reveal_min_margin: 0.4                     # green minus purple fill must differ by this much
  dance_motion_min: 12
  true_hsv: [[40, 90, 90], [85, 255, 255]]   # green = True (left)
  false_hsv: [[130, 60, 60], [165, 255, 255]]  # purple = False (right)

# --- Learn analysis (KICKOFF 11.3) ---
analysis:
  duplicate_distance: 2                      # pHash distance treated as the same frame
  transition_distance: 14                    # bigger jumps are transitions, not stable frames
  cluster_distance: 1.6                      # agglomerative clustering threshold (pHash bits + HSV hist)
  min_cluster: 3                             # smaller clusters merge into the nearest state
  samples_per_state: 4
  ocr: true
  ocr_upscale: 1.5
  max_regions: 20

# --- Best Guess Hunter (Phases A/B) ---
hunt:
  panel_timeout_s: 4                         # My Parties must appear within this after the hat click
  panel_poll_s: 0.25
  panel_settle_s: 0.4                        # let the panel finish animating before analysing
  close_timeout_s: 3
  join_retry_s: 30                           # "wait" popup after GO NOW: retry cadence
  join_max_retries: 10
  arrival_timeout_s: 8                       # room must change within this after GO NOW
  sighting_merge_gap_s: 900                  # sightings closer than this merge into one row
  antiafk_each_cycle: true                   # one cancelling pair before every scan

# --- Activity Test (KICKOFF 7.3) ---
activity_test:
  phase_minutes: 8
  movement_interval_s: 60
  panel_interval_s: 60

# --- Controls ---
hotkeys:
  kill: f12
  pause: f11
  toggle_mode: f9
  learn_mark: f6
  learn_correct: f7
  learn_wrong: f8
dry_run: false
presence_slack_s: 0.5                        # OS input newer than our last injection + this = William is back

# --- Input ---
input:
  click_hold_ms: 60
  cursor_settle_ms: 30
  key_method: scancode                       # scancode | vk  (input-test decides; see decisions.md)
  postcondition_retries: 1
  foreground_timeout_s: 2.0
  history_len: 200

# --- Learn ---
learn:
  keyframe_threshold: 12                     # pHash Hamming distance for a new keyframe (ambient animation = 6-8)
  ring_fps: 5
  ring_window_s: 5
  heartbeat_s: 30                            # force a keyframe at least this often even with no change
  jpeg_quality: 90                           # ring-buffer frames
  phash_width: 256                           # downscale width used for the keyframe hash
  ocr_keyframes: true                        # run Windows OCR on every keyframe (meta.jsonl "ocr" lines)
