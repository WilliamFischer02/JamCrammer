# JamCrammer configuration (copy to config.yaml; config.yaml is gitignored).
# Every number lives here or in profiles/*.yaml. Code has no magic numbers.

# --- Window and capture ---
window_title_match: "Animal Jam Classic"     # exact top-level window title
window_process_name: "AJ Classic.exe"        # Electron client; browser tabs with the same title are ignored
capture_backend: auto                        # auto | wgc | mss
fps: 4                                       # steady-state capture rate

# --- Timing (seconds) ---
hunt_interval_s: 300
opportunist_check_s: 300
resume_after_idle_s: 120
heartbeat_s: 180

# --- Anti-AFK ---
antiafk:
  tap_ms: 200
  gap_ms: 300
  settle_ms: 400                             # wait after a pair before the drift check
  pattern: [[left, right], [up, down], [right, left], [down, up]]

# --- Behavior toggles ---
auto_join: true
start_farming_after_join: true
unknown_fact_policy: crowd                   # crowd (fuller side of the floor) | learned_prior | fixed_true | fixed_false | skip
answer_mode: learn_only                      # learn_only | bank_policy | coin_flip
fuzzy_threshold: 90
hunt:
  antiafk_each_cycle: true                   # a cancelling movement pair before every My Parties scan
  derby_while_waiting: true                  # Best Guess Farmer started in the den: race the Derby until Best Guess is due, else wait there

# --- Notifications ---
notify:
  toast: true
  sound: true
  ntfy_topic: ""                             # empty = disabled
  ntfy_server: "https://ntfy.sh"
  discord_webhook: ""                        # empty = disabled
  levels:
    toast: NOTICE                            # minimum level that raises a toast
    sound: HIGH
    push: HIGH                               # ntfy + discord
  sound_repeats: 3                           # HIGH alerts repeat the sound
  sound_interval_s: 1.5
  timeout_s: 10

# --- Popup Watchdog ---
watchdog:
  fps: 2                                     # minimum detection rate
  clear_timeout_s: 3                         # popup must be gone this long after the click
  ocr_interval_s: 5                          # keyword-only OCR cadence when no green button is seen
  max_retries: 1
  unknown_cooldown_s: 60                     # don't re-alert the same unknown dialog more often
  unknown_min_ticks: 3                       # an unknown modal must persist this many ticks before alerting
  baseline_refresh_s: 30                     # re-take the room baseline this often while nothing is detected

# --- Room-drift guard ---
drift:
  threshold: 18                              # mean abs diff (0-255) on the masked downscale
  downscale: [64, 36]

# --- Double Up farmer (KICKOFF 9.2) ---
double_up:
  preview_s: 3                               # the board is shown for 3 s
  burst_fps: 10                              # burst capture during the preview
  pair_confidence_min: 0.6                   # below this: reveal-and-remember
  flip_ms: 400                               # flip animation (profile may override later)
  settle_s: 0.15
  click_gap_s: 0.08
  poll_s: 0.25
  board_timeout_s: 20
  hide_timeout_s: 5
  end_timeout_s: 10
  change_threshold: 18                       # tile face mean abs diff that counts as a flip
  same_face_distance: 0.35                   # descriptor distance treated as the same face
  preview_diversity: 0.5                     # mean tile distance when all faces are up
  hidden_uniformity: 0.25                    # mean tile distance when all tiles are hidden
  tile_min_std: 8
  end_screen_keywords: [earned, gems, play again]

# --- Best Guess farmer (Phase C, KICKOFF 8.3) ---
bestguess:
  fps: 5
  commit_after_s: 3                          # commit 2-4 s after the question appears
  lock_seconds: 5                            # countdown value at/below which sides can't change
  verify_after_s: 1
  heartbeat_s: 180                           # re-click the current side after this long idle
  unknown_pause_s: 30                        # UNKNOWN screen for this long -> pause + alert
  fact_min_chars: 8
  question_s: 10                             # question length; used when the countdown can't be read
  waiting_keywords: [get ready, next round, waiting, starting]
  ocr_upscale: 2.0
  reveal_min_fill: 0.03                      # fraction of the reveal-word ROI that must be coloured text
  reveal_ratio: 3                            # winning colour must beat the other by this factor
  score_upscale: 3.0                         # OCR upscale for the small round score
  banner_min_parchment: 0.3                  # parchment share of fact_roi below which the screen is UNKNOWN
  parchment_hsv: [[0, 0, 200], [180, 60, 255]]
  anchor_min_fill: 0.25                      # saturated share of arena_anchor_roi (gem icon) to count as in-arena
  anchor_hsv: [[0, 120, 120], [180, 255, 255]]
  dance_motion_min: 12
  true_hsv: [[36, 110, 150], [58, 255, 255]]   # green True! (measured 2026-10-26)
  false_hsv: [[0, 120, 150], [14, 255, 255]]   # orange False!

# --- Den planner: Jamaa Derby until Best Guess is due, then Best Guess ---
planner:
  demo: true                                 # first show the My Parties / tray round trip and read the time
  leave_lead_s: 90                           # leave the Derby this long before Best Guess is due
  eta_default_min: 45                        # used when neither the tray nor you gave a time
  tray_settle_s: 1.2
  panel_settle_s: 1.0
  games_settle_s: 1.5
  den_timeout_s: 20
  derby_timeout_s: 20
  hunt_interval_s: 20                        # My Parties re-check cadence once Best Guess is due
  max_attempts: 2
  ad_wait_s: 120                             # an advert between races hides the track: wait this long for it to return
  reentries_max: 20                          # the Derby is re-entered from the den at most this often per run
  scan_when_unread: true                     # tray unreadable: look in My Parties for the Best Guess banner before the default
  wait_poll_s: 5                             # Best Guess Farmer waiting in the den: countdown check cadence (keepalive between)
  gate_poll_s: 2                             # den gate: classify the live screen this often while no bot runs (read-only)

# --- "Hunt Best Guess" checkbox per farmer bot (run panel): read the tray, farm until due, join, hand over ---
hunt_best_guess:
  farm: true
  adventure: false
  opportunist: false

# --- Adventures (The Forgotten Desert / The Mystery Below, docs/ADVENTURES.md) ---
adventures:
  invite_keywords: [forgotten desert]        # "Join Me" bubbles naming these adventures are joined
  invite_join_words: [join, join me]         # the bubble's clickable blue header
  invite_fuzzy: 75                           # name fragments: the room label can cover half the bubble
  invite_min_chars: 4
  invite_line_gap: 1.5                       # name lines of one bubble, in line heights
  invite_crop_up: 3.0                        # "Join" is searched up to 3 name-line heights above
  invite_crop_side: 4.0
  invite_upscale: 2.0
  world:                                     # the world map (docs/MAPPING.md): per area a grid, a mosaic, the things
    grid_px: 35                              # scene px per occupancy cell (half a minimap px)
    mosaic_scale: 0.2                        # the mosaic is kept at this downscale
    vignette_px: 480                         # the lit disc around the animal that is pasted into the mosaic
    mosaic_min_v: 24                         # darker pixels never overwrite the mosaic
    merge_px: 120                            # sightings of one kind this close are one thing
    odom_scale: 0.25                         # odometry: phase correlation at this downscale ...
    odom_sigma: 6.0                          # ... after this high-pass (the darkness vignette)
    odom_min_response: 0.05                  # a weaker correlation peak is no measurement
    odom_max_px_s: 700                       # faster than the animal walks: a bad peak
    dot_gain: 0.15                           # the estimate moves this share toward the dot per update
    dot_reset_px: 250                        # this far off the dot ...
    dot_reset_n: 4                           # ... this many updates running: the dot wins outright
    dot_rejoin_px: 400                       # between commands, a dot this far away means the animal was moved (the dot lags a walk by ~1 s)
    probe_tick_s: 0.1                        # a probe looks this often
    probe_max_s: 2.5                         # ... and walks at most this long
    stuck_px: 12                             # moved less than this in a tick while a key is held ...
    stuck_ticks: 3                           # ... this many ticks running: a collision
    unknown_cost: 3.0                        # A* cost of an unknown cell (floor 1, walked 0.8)
    align_min_overlap: 0.2                   # a new observation is aligned to the mosaic when this share of it was seen before
    align_min_response: 0.12                 # ... and the correlation peak is at least this
    align_max_px: 160                        # ... and the shift is at most this (scene px)
    align_sigma: 3.0                         # high-pass at mosaic scale before correlating
    light_px: 260                           # radius of the animal's light (V falls below 40 past it)
    obs_keep: true                          # keep every observed frame + pose for the offline rebuild
    obs_every_s: 0.4                        # while a key is held, a frame is kept this often
    build_scale: 0.5                        # offline rebuild: phase correlation at this downscale
    build_sigma: 8.0                        # high-pass at build scale
    build_pairs: 6                          # earlier overlapping frames registered per frame
    build_min_overlap: 0.3                  # of the lit disc, by the poses
    build_max_err_px: 320                   # a shift this far from the kept poses is wrong
    build_passes: 2                         # unlinked frames are tried again against solved ones
    build_min_response: 0.08                # phase correlation peak
    build_patch_px: [320, 200, 128]         # full-resolution refinement patches, biggest first
    build_search_px: 6                      # searched this far around the coarse shift
    build_min_ncc: 0.45                     # the patch must correlate this well
    build_prior_weight: 0.002               # the kept pose's weight vs a pair's (1.0): the gauge only
    build_huber_px: 2.0                     # a pair's weight falls off past this residual
    build_solve_rounds: 4                   # reweighting rounds
    build_residual_px: 8                    # pairs off by more after a solve are dropped
    build_stack: 5                          # best-lit samples kept per tile pixel
    build_k: 3                              # the median of the k best-lit is the pixel
    build_min_v: 28                         # darker samples are not samples
    light_gain: [[110, 1.0], [200, 0.77], [300, 0.52], [360, 0.35]]  # the light's gain by radius (measured)
    build_min_gain: 0.3                     # samples with less light are not used
    build_gain_floor: 0.6                   # a sample is brightened by at most 1/this

# --- Opportunist (KICKOFF 10) ---
opportunist:
  entry_timeout_s: 8                         # the board must show within this after the entry clicks
  exit_timeout_s: 5
  settle_s: 0.5
  poll_s: 0.25
  max_entry_failures: 2                      # then fall back to plain Hunt + alert

# --- Jamaa Derby farmer (KICKOFF 9.3) ---
arcade_game: double_up                       # farm runs: double_up | jamaa_derby | gem_ball (tuner) | swoopy_eagle
derby:
  fps: 20                                    # control loop rate (jump timing resolution ~40 px at 800 px/s)
  jump_key: space
  jump_hold_ms: 40
  boosts_per_race: 3                         # all three carrots are used, on clear stretches
  boost_gap_s: 4.0
  boost_after_jump_s: 0.6
  boost_earliest_s: 2.0
  band_min_width_px: 40                      # narrower colour runs are sprites, not obstacles
  band_fill: 0.5                             # column fill for hay / mud / water (pale water/mud ripple)
  hedge_seed_fill: 0.62                      # dark green: a band needs one column this full ...
  hedge_grow_fill: 0.4                       # ... and extends through columns this full (tall-grass stripes)
  hedge_min_width_px: 150                    # the checkered finish's dark columns are ~130 px and never seed
  hedge_mean_fill: 0.55                      # a dark-green run must be this dark on average (checker ~0.45)
  band_pass_px: 120                          # a band this far past the hooves is behind us (late jumps still count)
  band_merge_gap_px: 300                     # same-kind pieces closer than this are one band (a horse in front splits it)
  speed_alpha: 0.3                           # scroll-speed estimate smoothing (from band motion)
  speed_max_dt_s: 0.3
  speed_max_step_px: 400
  speed_min_baseline_s: 0.1                  # scroll speed is measured over at least this long
  speed_min_px_s: 700
  speed_max_px_s: 1800
  track_hold_s: 0.4                          # keep predicting a band's edge this long after it was last seen
  track_stuck_px: 30                         # edge not moving left (horses in front of it) -> use the prediction
  track_new_band_px: 150
  jump_retry_s: 0.25                         # horse not rising this long after Space -> press again
  jump_retry_min_obs: 2                      # ... judged only after this many fresh frames
  period_alpha: 0.2                          # smoothing of the measured loop period (used in the jump lead)
  period_max_s: 0.5
  jump_rise_px: 20
  results_settle_s: 1.0
  unknown_pause_s: 30
  ocr_upscale: 2.0
  column_px: 320                             # one obstacle column; bands are 1, 2 or 3 columns wide
  boost_speed_ratio: 1.15                    # scroll faster than this x scroll_px_s = boosted (earlier press)
  boost_effect_s: 3.0                        # ... or a carrot was clicked this recently
  press_match_s: 1.2                         # a press this long before the edge passes belongs to that band
  hit_speed_ratio: 0.5                       # the passing band slower than this x nominal = we stumbled
  hit_min_obs: 2
  hit_window_s: 1.3
  learn_enabled: true                        # stumbles adjust per-class leads and colour ranges (data/derby_learned.json)
  learn_lead_step_px: 15
  learn_lead_max_px: 160
  learn_early_px: 120
  hay_hsv: [[18, 110, 150], [35, 255, 255]]  # hay H24 S163 V249; pale bales down to V160 live
  mud_hsv: [[6, 50, 40], [22, 255, 185]]     # mud H17 S113 V84; pale brown streaks up to V177 live
  water_hsv: [[72, 60, 80], [105, 255, 255]] # water H86 S83-173 V105-186 (pale ripples)
  hedge_hsv: [[40, 90, 85], [66, 255, 170]]  # hedge/tall grass V 93-170; light grass V 155-200 (fill separates)
  grass_hsv: [[40, 60, 150], [70, 255, 255]]   # light grass; the horse is whatever is neither grass nor a band
  horse_box_max_fill: 0.9                    # scenery share of the horse box above which the horse is hidden
  horse_min_px: 300
  beige_hsv: [[15, 0, 190], [35, 130, 255]]  # leaderboard parchment
  results_min_fill: 0.35
  white_hsv: [[0, 0, 230], [180, 40, 255]]   # start line
  startline_col_fill: 0.5
  startline_min_cols: 0.3
  progress_hsv: [[40, 90, 140], [70, 255, 255]] # green progress bar = we are on the track
  progress_min_fill: 0.4
  carrot_hsv: [[8, 150, 180], [22, 255, 255]]   # orange carrots still available
  carrot_min_fill: 0.05
  highlight_hsv: [[20, 150, 200], [35, 255, 255]] # yellow frame around our leaderboard row
  highlight_row_fill: 0.5                    # rows of the frame's long yellow lines
  highlight_min_rows: 6
  highlight_max_height_px: 90

# --- Pilot: Claude at the controls (docs/PILOT.md) ---
pilot:
  enabled: false                             # William's switch: pilot input allowed (look always works)
  forbidden_rois: [[760, 990, 600, 90], [1840, 985, 80, 95]]   # the chat field and the log-out button: never clicked
  max_hold_s: 3.0                            # a movement key held at most this long per command
  yield_s: 2.0                               # William's own input this recent: his controls, the pilot refuses
  max_goto_s: 60                             # one goto walks at most this long
  area: moths                                # the level area whose floor goto plans on
  budget_min: 45                             # a pilot session sends input at most this long (time-boxed)
  serve_poll_s: 0.05                         # `pilot serve` looks for a command file this often
  serve_timeout_s: 90                        # a client waits this long for the server's answer
  mouse_keepalive_s: 40                     # cursor moved a little over the floor this often while input runs (0 = never)
  mouse_keepalive_offset: [0, 150]          # from the animal's screen point (below its tag)
