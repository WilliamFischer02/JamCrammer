# JamCrammer configuration (copy to config.yaml; config.yaml is gitignored).
# Every number lives here or in profiles/*.yaml. Code has no magic numbers.

# --- Window and capture ---
window_title_match: "Animal Jam Classic"     # exact top-level window title
window_process_name: "AJ Classic.exe"        # Electron client; browser tabs with the same title are ignored
capture_backend: auto                        # auto | wgc | mss
fps: 4                                       # steady-state capture rate

# --- Timing (seconds) ---
hunt_interval_s: 300
opportunist_check_s: 300
resume_after_idle_s: 120
heartbeat_s: 180

# --- Anti-AFK ---
antiafk:
  tap_ms: 200
  gap_ms: 300
  pattern: [[left, right], [up, down], [right, left], [down, up]]

# --- Behavior toggles ---
auto_join: true
start_farming_after_join: true
unknown_fact_policy: learned_prior           # learned_prior | fixed_true | fixed_false | skip
answer_mode: learn_only                      # learn_only | bank_policy | coin_flip
fuzzy_threshold: 90

# --- Notifications ---
notify:
  toast: true
  sound: true
  ntfy_topic: ""                             # empty = disabled
  discord_webhook: ""                        # empty = disabled
  levels:
    toast: NOTICE                            # minimum level that raises a toast
    sound: HIGH
    push: HIGH

# --- Controls ---
hotkeys:
  kill: f12
  pause: f11
  toggle_mode: f9
  learn_mark: f6
  learn_correct: f7
  learn_wrong: f8
dry_run: false
presence_slack_s: 0.5                        # OS input newer than our last injection + this = William is back

# --- Input ---
input:
  click_hold_ms: 60
  cursor_settle_ms: 30
  key_method: scancode                       # scancode | vk  (input-test decides; see decisions.md)
  postcondition_retries: 1
  foreground_timeout_s: 2.0
  history_len: 200

# --- Learn ---
learn:
  keyframe_threshold: 12                     # pHash Hamming distance for a new keyframe (ambient animation = 6-8)
  ring_fps: 5
  ring_window_s: 5
  heartbeat_s: 30                            # force a keyframe at least this often even with no change
  jpeg_quality: 90                           # ring-buffer frames
  phash_width: 256                           # downscale width used for the keyframe hash
  ocr_keyframes: true                        # run Windows OCR on every keyframe (meta.jsonl "ocr" lines)
