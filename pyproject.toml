[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jamcrammer"
version = "0.1.0"
description = "Screen-only automation and learning tool for Animal Jam Classic (desktop app)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "PySide6==6.12.0",
  "pyqtgraph==0.14.0",
  "opencv-python==5.0.0.93",
  "numpy==2.5.4",
  "mss==10.2.0",
  "windows-capture==2.0.1",
  "pywin32==312",
  "pydirectinput==1.0.4",
  "pyautogui==0.9.54",
  "keyboard==0.13.5",
  "pynput==1.8.2",
  "winocr==0.0.15",
  "rapidfuzz==3.14.6",
  "imagehash==4.3.2",
  "Pillow==13.0.0",
  "scikit-learn==1.9.1",
  "pyyaml==6.0.3",
  "pydantic==2.14.1",
  "requests==2.34.2",
  "winotify==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "types-PyYAML",
  "types-requests",
  "types-pywin32",
]

[project.scripts]
jamcrammer = "jamcrammer.cli:main"

[tool.setuptools.packages.find]
include = ["jamcrammer*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913", # many args is fine for dataclass-ish ctors
  "PLR2004", # magic numbers: enforced by review, not lint (tests use literals)
  "RUF012",
  "PLC0415", # lazy imports are deliberate: Qt and win32 load only where needed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011"]
"jamcrammer/app/theme.py" = ["E501"]  # generated QSS rules read better on one line
"jamcrammer/app/**" = ["RUF001", "PLR0915", "E501"]  # UI copy: typographic dashes, long builders, long strings
"scripts/**" = ["PLR0915", "E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["jamcrammer", "tests"]

[[tool.mypy.overrides]]
module = ["jamcrammer.core.*", "jamcrammer.platform.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: needs the live AJC window (skipped in CI)",
]

[tool.ruff.lint.isort]
known-first-party = ["jamcrammer"]
