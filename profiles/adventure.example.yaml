# Adventure HUD geometry shared by the adventure route farmers (stage pixels, 1920x1080).
# Measured 2026-10-29 on William's The Mystery Below (Hard) Learn session
# captures/sessions/20261029_134501_mystery_below (external monitor, 1920x1009 client).
version: 1
name: adventure
fields:
  banner_roi:
    type: roi
    label: Objective banner
    help: The banner at the top ('Find 3 GLOW MOTHS...'). OCR here tells the bot which objective is active.
    value: [440, 0, 1040, 36]
    status: calibrated
    note: objective banner at the top ("Find 3 GLOW MOTHS and LEAD THEM to the door.")
  minimap_roi:
    type: roi
    label: Minimap
    help: The inside of the minimap frame (north up, revealed as explored). The player dot is found here; the mapping pilot works in minimap pixels.
    value: [1480, 737, 293, 186]
    status: calibrated
    note: inside of the minimap frame (fixed map, north up, revealed as explored)
  minimap_exclude_roi:
    type: roi
    label: Minimap zoom button
    help: The minimap's light-blue '+' button, the same colour as the player dot; excluded so it is never taken for the dot.
    value: [1732, 722, 60, 58]
    status: calibrated
    note: the minimap's light-blue "+" zoom button (same colour as the player dot)
  dot_hsv:
    type: color
    label: Player dot colour
    help: The light-blue dot that marks you on the minimap. Sample the dot.
    value: [[90, 30, 190], [120, 210, 255]]
    status: calibrated
    note: the player's light-blue minimap dot (OpenCV HSV; measured p5-p95 H92-107 S69-191 V201-251)
  dot_area:
    type: list
    label: Player dot size
    help: Smallest and largest pixel area of the dot blob; other blobs are map features.
    value: [60, 420]
    status: calibrated
    note: pixel area of the dot blob (172 measured); smaller/larger blobs are map features
  items_roi:
    type: roi
    label: Item slots
    help: The top-left item slots (light blossoms, boomseeds). A pickup or a use changes this area.
    value: [120, 50, 280, 130]
    status: calibrated
    note: top-left item slots (light blossoms, boomseeds); a pickup or a use changes it
  hud_rois:
    type: list
    label: Screen-fixed HUD parts
    help: Boxes masked out of scene alignment because they do not move with the world (bottom bar, side tabs, minimap, banner, items).
    value: [[0, 935, 1920, 145], [1830, 0, 90, 1080], [0, 0, 90, 1080], [1460, 715, 340, 230], [440, 0, 1040, 40], [120, 50, 280, 130]]
    status: calibrated
    note: screen-fixed parts (bottom bar with the chat tab and the portrait, the room frame left and right, minimap, banner, items) masked out of scene alignment and the map (widened 2026-11-03 after the bar's top showed in the map)
  nametag_template:
    type: template
    label: Your name tag image
    help: Your animal's name tag (badge, name, icon) as it floats under the animal. Where it is on screen is where the animal is, because the camera lags a walk and stops at an area's edge.
    value: templates/adventures/nametag.png
    status: calibrated
    note: our animal's name tag (badge, name, icon) as it floats under the animal; where it is on screen is where the animal is (the camera lags a walk and stops at the area's edge, so the animal is not always at avatar_xy); score 1.0 / 0.96 in the cave, 0.82 in the den
  nametag_min:
    type: number
    label: Name tag match score
    help: Template score that counts as the tag.
    value: 0.7
    status: calibrated
    note: template score that counts as the tag
  nametag_box:
    type: roi
    label: Animal around the tag
    help: The animal and its tag relative to the tag's centre (x, y, w, h); masked out of the map. Relative, so it is not drawn.
    value: [-130, -165, 260, 200]
    status: calibrated
    note: the animal and its tag relative to the tag's centre (x, y, w, h); masked out of the map
  player_from_tag:
    type: point
    label: Animal point from the tag
    help: The animal's reference point (what the animal centre is when the tag sits at its median) relative to the tag's centre. Relative, so it is not drawn.
    value: [5, -25]
    status: calibrated
    note: the animal's reference point (what avatar_xy is when the tag sits at its median) relative to the tag's centre
  avatar_roi:
    type: roi
    label: Your animal (box)
    help: Your animal at the screen centre (the camera follows it); masked so any animal aligns.
    value: [860, 360, 300, 300]
    status: proposed
    note: our animal at the screen centre (the camera follows it); masked so any animal aligns
  dialog_x_template:
    type: template
    label: Dialog close X image
    help: The blue X of in-adventure dialogs (Cosmo, Graham); matched to notice and close them.
    value: templates/adventures/dialog_x.png
    status: calibrated
    note: the blue X of in-adventure dialogs (Cosmo, Graham); match 1.00 on six dialogs, <=0.54 elsewhere
  dialog_x_search_roi:
    type: roi
    label: Where a dialog's X can be
    help: Dialogs open centred; the X is searched only here.
    value: [1180, 220, 460, 480]
    status: calibrated
    note: where a dialog's X can be (dialogs open centred; X at 1409,454 on all six seen)
  dialog_x_min:
    type: number
    label: Dialog X match score
    help: Template score that counts as an open dialog.
    value: 0.8
    status: calibrated
    note: template score that counts as an open dialog
  # --- level model (modes/adventures/level.py, nav.py, objects.py, inventory.py, opening.py) ---
